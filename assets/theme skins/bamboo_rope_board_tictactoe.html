
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
.scene{width:100%;min-height:640px;background:#1a3a5c;border-radius:16px;overflow:hidden;position:relative;display:flex;flex-direction:column;align-items:center;padding:20px 16px 20px}
.sky-bg{position:absolute;top:0;left:0;right:0;height:44%;background:#1c3f6e}
.horizon-glow{position:absolute;top:36%;left:0;right:0;height:28px;background:#c47a2a;opacity:0.2}
.ocean-base{position:absolute;bottom:0;left:0;right:0;height:52%;background:#1a4f7a}
.wave-a{position:absolute;bottom:34%;left:-10px;right:-10px;height:36px;background:#2a6fa0;border-radius:50% 50% 0 0/14px 14px 0 0;opacity:0.55}
.wave-b{position:absolute;bottom:26%;left:-20px;right:-20px;height:44px;background:#1e5c8a;border-radius:50% 50% 0 0/18px 18px 0 0;opacity:0.72}
.sand-base{position:absolute;bottom:0;left:0;right:0;height:26%;background:#c8a86a}
.sand-rim{position:absolute;bottom:24.5%;left:0;right:0;height:14px;background:#d4b47a;border-radius:50% 50% 0 0/5px 5px 0 0}
.sun-orb{position:absolute;top:26px;left:50%;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;background:#f5c842;opacity:0.82}

.player-card{background:rgba(18,42,70,0.9);border:1.5px solid #3a6fa0;border-radius:10px;padding:7px 16px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:118px}
.player-card.active{border-color:#e8a830}
.p-name{font-family:'Fredoka One',cursive;font-size:15px;color:#ddeeff}
.p-turn{font-family:'Fredoka One',cursive;font-size:11px;color:#e8a830}
.p-turn.off{visibility:hidden}
.score-row{display:flex;gap:14px;margin-bottom:8px}
.pill{background:rgba(14,28,48,0.7);border:0.5px solid #2a4e70;border-radius:20px;padding:3px 13px;font-family:'Fredoka One',cursive;font-size:12px;color:#8ab4d4;display:flex;align-items:center;gap:5px}
.pill span{color:#ddeeff;font-size:13px}
.game-title{font-family:'Fredoka One',cursive;font-size:28px;color:#f0e0b0;letter-spacing:0.07em;position:relative;z-index:10;margin:6px 0 10px;text-align:center}
.btn-row{display:flex;gap:12px;margin-top:10px;position:relative;z-index:10}
.btn{background:rgba(18,42,70,0.92);border:1.5px solid #3a6fa0;border-radius:8px;padding:9px 20px;font-family:'Fredoka One',cursive;font-size:14px;color:#ddeeff;cursor:pointer;display:flex;align-items:center;gap:7px}
.btn:hover{background:rgba(28,60,100,0.95)}
.btn.warm{background:rgba(65,32,8,0.92);border-color:#9a601c;color:#f0d0a0}
.btn.warm:hover{background:rgba(82,42,10,0.95)}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes sunpulse{0%,100%{opacity:0.82}50%{opacity:0.65}}
</style>
