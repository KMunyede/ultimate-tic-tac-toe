
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
.scene{width:100%;height:580px;background:#a8d8ea;overflow:hidden;position:relative;border-radius:16px}
.sky{position:absolute;top:0;left:0;right:0;height:60%;background:#a8d8ea}
.ocean-far{position:absolute;bottom:30%;left:0;right:0;height:40px;background:#3a8fbf;border-radius:50% 50% 0 0/10px 10px 0 0;opacity:0.5}
.ocean-mid{position:absolute;bottom:22%;left:-20px;right:-20px;height:50px;background:#2a7aaa;border-radius:50% 50% 0 0/18px 18px 0 0;opacity:0.7}
.ocean-near{position:absolute;bottom:14%;left:-30px;right:-30px;height:55px;background:#1a6a96;border-radius:50% 50% 0 0/22px 22px 0 0}
.ground{position:absolute;bottom:0;left:0;right:0;height:16%;background:#6b4c2a}
.ground-top{position:absolute;bottom:14%;left:0;right:0;height:20px;background:#8b6040;border-radius:50% 50% 0 0/8px 8px 0 0}
.sun{position:absolute;top:32px;left:50%;transform:translateX(-50%);width:54px;height:54px;border-radius:50%;background:#f5c842}
.sun-ray{position:absolute;top:50%;left:50%;width:70px;height:4px;background:#f5c842;transform-origin:0 50%;border-radius:2px;opacity:0.5}
.cloud{position:absolute;background:#e8f4f8;border-radius:50px}

.bamboo-stalk{position:absolute;bottom:14%;width:18px;background:#7ab840;border-radius:4px 4px 0 0}
.bamboo-node{position:absolute;width:22px;height:5px;background:#5a9020;border-radius:3px;left:-2px}
.bamboo-leaf{position:absolute;width:36px;height:14px;background:#6ab030;border-radius:50%;transform-origin:0 50%}

.animal{position:absolute;bottom:14%}

.panda-body{width:52px;height:48px;background:#f5f5f0;border-radius:50% 50% 44% 44%;border:2px solid #ddd;position:relative}
.panda-ear{width:18px;height:18px;background:#2a2a2a;border-radius:50%;position:absolute;top:-10px}
.panda-eye-patch{width:14px;height:12px;background:#2a2a2a;border-radius:50%;position:absolute;top:10px}
.panda-eye{width:6px;height:6px;background:#fff;border-radius:50%;position:absolute}
.panda-pupil{width:3px;height:3px;background:#111;border-radius:50%;position:absolute}
.panda-nose{width:8px;height:5px;background:#e8a0a0;border-radius:50%;position:absolute;top:26px;left:21px}
.panda-leg{width:18px;height:20px;background:#2a2a2a;border-radius:0 0 8px 8px;position:absolute;bottom:-16px}

.turtle-shell{width:54px;height:38px;background:#5a9a30;border-radius:50% 50% 40% 40%;border:2.5px solid #3a7010;position:relative}
.turtle-head{width:20px;height:18px;background:#7aba48;border-radius:50% 50% 40% 40%;position:absolute;right:-16px;top:6px;border:2px solid #5a9a30}
.turtle-eye{width:5px;height:5px;background:#222;border-radius:50%;position:absolute;top:5px;right:3px}
.turtle-leg{width:14px;height:12px;background:#7aba48;border-radius:50%;position:absolute;border:2px solid #5a9a30}
.shell-hex{position:absolute;border:1.5px solid #3a7010;border-radius:4px}

.crab-body{width:44px;height:28px;background:#e05530;border-radius:50% 50% 40% 40%;border:2px solid #b03010;position:relative}
.crab-eye-stalk{width:6px;height:12px;background:#e05530;border-radius:3px;position:absolute;top:-12px;border:1.5px solid #b03010}
.crab-eye-ball{width:9px;height:9px;background:#fff;border-radius:50%;position:absolute;top:-9px;left:-1.5px;border:1.5px solid #b03010}
.crab-pupil{width:4px;height:4px;background:#111;border-radius:50%;position:absolute;top:2px;left:2px}
.crab-claw{width:16px;height:14px;background:#e05530;border-radius:50% 50% 8px 8px;border:2px solid #b03010;position:absolute}
.crab-leg{width:3px;height:16px;background:#e05530;border-radius:2px;position:absolute;border:1px solid #b03010}

@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes sway2{0%,100%{transform:rotate(3deg)}50%{transform:rotate(-3deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

@keyframes clawwave{0%,100%{transform:rotate(-15deg)}50%{transform:rotate(15deg)}}
@keyframes leafsway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes eyeblink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(0.1)}}
@keyframes sunpulse{0%,100%{opacity:0.5}50%{opacity:0.8}}
@keyframes float{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
